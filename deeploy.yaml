# deeploy-ci settings: the AI system you govern, which tests prove which controls, and who approves releases.

# The AI system. `setup` creates it in Deeploy as a "use case" (or reuses one with this name).
use_case:
  name: "Example AI assistant"
  description: "Example: CI/CD test results as evidence in Deeploy"
  risk_classification: limited   # unclassified | minimal | limited | high | unacceptable | generalPurposeAI
  owner_email: ""                # only needed when your Deeploy workspace has several owners

# Your tests (name as in the JUnit XML) and the controls each one proves.
tests:
  test_answer_contains_disclaimer: [POL-1]
  test_no_personal_data_in_logs: [POL-2]
  test_low_confidence_goes_to_a_human: [POL-2]

# Your own controls. `setup` creates them in Deeploy, in a framework with this name.
own_framework:
  name: "Engineering AI policies (starter)"
  controls:
    POL-1: "Medical disclaimer. Every answer to a patient contains the 'not medical advice' disclaimer."
    POL-2: "Privacy and oversight. No personal data in logs; low-confidence answers go to a human."

# Who approves a release in Deeploy: e-mail addresses of members of the workspace.
# Empty = the workspace owners (fine to try; in production name people, never the pipeline's own user).
approvers: []

timezone: Europe/Amsterdam   # for the times shown in Deeploy and GitHub

# Where in Deeploy. You set workspace_id; setup fills in the rest.
deeploy:
  api: https://api.app.deeploy.ml
  app: https://app.deeploy.ml
  workspace_id: ""
  use_case_id: ""           # filled in by setup
  deployment_id: ""         # filled in by setup
  report_id: ""             # filled in by setup
