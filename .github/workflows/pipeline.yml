# The pipeline. Jobs 2-4 are the Deeploy layer on top of your own test and deploy steps.
# The Deeploy credential lives in the GitHub environment "deeploy": only those jobs can read it.
name: Pipeline · tests → evidence in Deeploy → approval in Deeploy → deploy

on:
  push:
    branches: [main]
  pull_request:            # pull requests only run the tests; Deeploy follows main
  workflow_dispatch:

concurrency:               # a newer commit replaces a run that is still waiting for approval
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 1 · Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q pytest .
      - name: Run the tests of the AI system
        run: pytest example --junitxml=results.xml
      - name: Show the results, and the Deeploy control each test proves
        if: always()
        run: deeploy-ci test-summary results.xml
      - name: Keep the results for the next job
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: test-results, path: results.xml }

  evidence:
    name: 2 · Evidence in Deeploy
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment: deeploy
    permissions:
      contents: read
      issues: write        # an issue per control whose tests failed
    env:
      DEEPLOY_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      DEEPLOY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q .
      - uses: actions/download-artifact@v8
        with: { name: test-results }
      - name: Fill in the test report and update the controls in Deeploy
        run: deeploy-ci report results.xml
      - name: Keep the evidence record in GitHub
        uses: actions/upload-artifact@v7
        with: { name: deeploy-evidence, path: deeploy-evidence.json, retention-days: 90, if-no-files-found: ignore }

  approval:
    name: 3 · Approval in Deeploy
    needs: [test, evidence]                   # only when every test passed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: deeploy
    outputs:
      release: ${{ steps.gate.outputs.release }}        # "true" once approved (or approval.mode soft / off)
      version_id: ${{ steps.gate.outputs.version_id }}
    env:
      DEEPLOY_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      DEEPLOY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q .
      - uses: actions/download-artifact@v8
        with: { name: deeploy-evidence }
      - name: Register this commit as a version in Deeploy and wait until it's approved there
        id: gate
        run: deeploy-ci gate

  deploy:
    name: 4 · Deploy
    needs: approval
    if: needs.approval.outputs.release == 'true'          # never without an approval
    runs-on: ubuntu-24.04
    environment: deeploy
    env:
      DEEPLOY_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      DEEPLOY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q .
      - name: Deploy the AI system (replace with your own deploy)
        run: echo "Deploying ${GITHUB_SHA::7}"
      - name: Mark the version live in Deeploy
        if: needs.approval.outputs.version_id != ''
        run: deeploy-ci released ${{ needs.approval.outputs.version_id }}
